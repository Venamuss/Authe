name: CI

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m
        continue-on-error: true

  test:
    name: Unit Tests & Race Detector
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run tests with Race Detector
        run: |
          go test -v -race -coverprofile=coverage.out ./...

      - name: Check Coverage
        run: |
          go tool cover -func=coverage.out

  build-binaries:
    name: Build Go Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build All Microservices
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux go build -o bin/user ./cmd/user/main.go
          CGO_ENABLED=0 GOOS=linux go build -o bin/post ./cmd/post/main.go
          CGO_ENABLED=0 GOOS=linux go build -o bin/notifications ./cmd/notifications/main.go
          CGO_ENABLED=0 GOOS=linux go build -o bin/migrator ./cmd/migrator/main.go

  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test, build-binaries]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker target (user)
        uses: docker/build-push-action@v5
        with:
          context: .
          target: user
          push: false

      - name: Build Docker target (post)
        uses: docker/build-push-action@v5
        with:
          context: .
          target: post
          push: false

      - name: Build Docker target (notifications)
        uses: docker/build-push-action@v5
        with:
          context: .
          target: notifications
          push: false

      - name: Build Docker target (migrator)
        uses: docker/build-push-action@v5
        with:
          context: .
          target: migrator
          push: false

